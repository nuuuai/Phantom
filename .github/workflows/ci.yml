name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# One job, strict order: install → migrate → seed → lint → test → build (matches docs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phantom
          POSTGRES_PASSWORD: phantom_ci
          POSTGRES_DB: phantom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phantom -d phantom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://phantom:phantom_ci@localhost:5432/phantom
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma migrate deploy
        run: npm run db:migrate:deploy -w @phantom/api
      - name: Prisma seed (broker catalog + dev user)
        run: npm run db:seed -w @phantom/api
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
